name: mzazicare-backend

# The whole stack — MongoDB, Redis, RustFS and the API — comes up together:
#   pnpm infra:up   → docker compose up -d  (everything, API hot reloads)
#   pnpm app:up     → docker compose up -d --build (same, but rebuild first)
#
# Ports follow your .env, so if something already owns one on your machine
# just change it there and bring the stack up again.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage: KYC documents, visit photos, elder photos.
  # RustFS, a MinIO-compatible server written in Rust. Console (browser UI)
  # on ${RUSTFS_CONSOLE_PORT:-9001}.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Inside the compose network the services are reachable by name, not on
      # localhost — these override whatever .env says for host-based dev.
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DB:-mzazicare}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RUSTFS_ENDPOINT: rustfs
      RUSTFS_PORT: "9000"
      # A presigned URL is signed against a host. The API signs via "rustfs",
      # which does not resolve in your browser — so sign for the host port.
      RUSTFS_PUBLIC_URL: http://localhost:${RUSTFS_PORT:-9000}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      # Keep the container's node_modules; never shadow it with the host's.
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:
  rustfs-data:
